
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unity Enterprises Application Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<div class="header">
<h1>UNITY ENTERPRISES</h1>
<p>Online Job Application Form</p>
</div>

<form id="jobForm">

<h2>Personal Details</h2>

<label>Full Name *</label>
<input type="text" id="fullName" name="fullName" required>

<label>Father/Husband Name *</label>
<input type="text" id="fatherName" name="fatherName" required>

<label>Mobile Number *</label>
<input type="tel" id="mobile" name="mobile" required>

<label>Email ID *</label>
<input type="email" id="email" name="email" required>

<label>Instagram ID</label>
<input type="text" id="instagram" name="instagram">

<label>Telegram ID</label>
<input type="text" id="telegram" name="telegram">

<label>Date of Birth</label>
<input type="date" id="dob" name="dob">

<label>Gender</label>
<select id="gender" name="gender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Marital Status</label>
<select id="maritalStatus" name="maritalStatus">
<option>Single</option>
<option>Married</option>
</select>

<label>Address</label>
<textarea id="address" name="address"></textarea>

<h2>Education</h2>

<label>Educational Qualification</label>
<input type="text" id="education" name="education">

<label>Technical Qualification</label>
<input type="text" id="technical" name="technical">

<label>Work Experience</label>
<textarea id="experience" name="experience"></textarea>

<h2>Job Preference</h2>

<label>Choice of Work</label>
<select id="jobChoice" name="jobChoice">
<option>Back Office</option>
<option>Digital Marketing</option>
<option>Field Executive</option>
<option>Tele Calling</option>
<option>Plan Presenter</option>
</select>

<label>Choice of Time</label>
<select id="timeChoice" name="timeChoice">
<option>Full Time</option>
<option>Part Time</option>
<option>Weekend</option>
<option>Freelancer</option>
</select>

<h2>Documents</h2>

<label>Passport Size Photo</label>
<input type="file" id="photo">

<label>Resume</label>
<input type="file" id="resume">

<button type="submit">Submit Application</button>

</form>

</div>

<script src="script.js"></script>

</body>
</html>
